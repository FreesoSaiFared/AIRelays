name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Byte-compile source and tests
        run: python -m compileall src tests

  session-farm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run session-farm state-machine tests
        run: node --test tools/session-farm/session-farm.test.mjs

      - name: Syntax-check session-farm entrypoints
        run: |
          node --check tools/session-farm/session-farm.mjs
          node --check tools/session-farm/session-farm-mcp.mjs
          node --check tools/session-farm/session-farm-http-mcp.mjs

  session-farm-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse Windows session-farm PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'tools/session-farm/deploy-windows.ps1',
            'tools/session-farm/install-windows.ps1',
            'tools/session-farm/activate-cua.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
          }

      - name: Run canonical Windows deployment validation
        shell: powershell
        run: |
          $receipt = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/session-farm/deploy-windows.ps1 -RepoRoot $PWD -ValidationOnly
          $receipt
          $json = $receipt | ConvertFrom-Json
          if (-not $json.ok -or -not $json.validationOnly) { throw 'validation receipt was not successful' }
          if ($json.node -notmatch '^v22\.') { throw "unexpected Node version: $($json.node)" }
          if (-not $json.validation.tests) { throw 'state-machine tests did not report success' }

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build docs site
        run: mkdocs build -q
