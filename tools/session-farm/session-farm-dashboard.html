<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIRelays Session Farm</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#0b0d10;color:#e8edf2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#18212b 0,transparent 34%),#0b0d10}main{max-width:1500px;margin:auto;padding:28px}.top{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8ba4b8}h1{margin:4px 0 0;font-size:clamp(27px,4vw,48px);font-weight:660;letter-spacing:-.04em}.meta{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#95a5b3;text-align:right}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}.metric,.card{border:1px solid #25303a;background:rgba(18,23,29,.9);box-shadow:0 16px 55px rgba(0,0,0,.22);border-radius:14px}.metric{padding:12px 14px}.metric b{font-size:22px;display:block}.metric span{font-size:11px;color:#8293a1;text-transform:uppercase;letter-spacing:.11em}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{position:relative;padding:16px;min-height:238px;overflow:hidden}.card.orch{grid-column:span 3;border-color:#3a4c5c}.bar{position:absolute;left:0;right:0;top:0;height:3px;background:#4b5964}.card.ready .bar{background:#6dd3a0}.card.busy .bar{background:#e6b85c}.card.missing .bar,.card.probe-error .bar{background:#f07070}.card.paused .bar{background:#8d7cdc}.head{display:flex;justify-content:space-between;gap:8px;align-items:center}.id{font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace}.role{font-size:11px;color:#8fa1af}.status{font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace;padding:5px 8px;border-radius:999px;background:#202830;color:#a9bac6}.ready .status{color:#83e7b4}.busy .status{color:#f0ca7b}.missing .status,.probe-error .status{color:#ff9292}.tail{white-space:pre-wrap;overflow:auto;max-height:106px;margin:14px 0;background:#0d1116;border:1px solid #202832;border-radius:9px;padding:10px;font:11px/1.42 ui-monospace,SFMono-Regular,Consolas,monospace;color:#bdc7cf}.small{font:10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:#758794;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}button{border:1px solid #34414b;background:#1b2229;color:#dce5eb;border-radius:8px;padding:6px 9px;font:600 11px inherit;cursor:pointer}button:hover{background:#27323b}button.warn{border-color:#604447}#err{display:none;margin:0 0 14px;padding:11px;border:1px solid #673e43;background:#26161a;color:#ffb1b8;border-radius:10px;font:12px ui-monospace,monospace}@media(max-width:900px){.grid{grid-template-columns:1fr}.card.orch{grid-column:auto}.summary{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.meta{text-align:left}}
</style>
</head>
<body><main>
<div class="top"><div><div class="eyebrow">AIRelays control plane</div><h1>Session Farm</h1></div><div class="meta" id="meta">connecting…</div></div>
<div id="err"></div><section class="summary" id="summary"></section><section class="grid" id="grid"></section>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={ok:false,error:t}}if(!r.ok)throw new Error(j.error||`${r.status}`);return j}
function action(worker,kind){return api(`/api/${kind}`,{worker}).then(refresh).catch(showErr)}
function showErr(e){const el=document.querySelector('#err');el.style.display='block';el.textContent=e?.message||e}
function card(s){const status=s.paused?'paused':s.status||'unknown';const isWorker=s.role==='worker';return `<article class="card ${esc(status)} ${s.role==='orchestrator'?'orch':''}"><div class="bar"></div><div class="head"><div><span class="id">${esc(s.id)}</span> <span class="role">${esc(s.role)}</span></div><span class="status">${esc(status)}</span></div><div class="tail">${esc(s.lastAssistantTail||'(no assistant output observed)')}</div><div class="small">target ${esc(s.targetId||'—')} · marker ${s.markerPresent?'yes':'no'} · busy ${s.busy?'yes':'no'}</div><div class="small">${esc(s.boundUrl||'(unbound)')}</div>${isWorker?`<div class="actions"><button onclick="action('${esc(s.id)}','continue')">continue</button>${s.paused?`<button onclick="action('${esc(s.id)}','resume')">resume</button>`:`<button onclick="action('${esc(s.id)}','pause')">pause</button>`}</div>`:''}</article>`}
async function refresh(){try{const d=await api('/api/status');document.querySelector('#err').style.display='none';const slots=Object.values(d.slots||{});const workers=slots.filter(x=>x.role==='worker');const ready=workers.filter(x=>x.ready&&!x.paused).length,busy=workers.filter(x=>x.busy).length,missing=workers.filter(x=>!x.targetId).length;document.querySelector('#summary').innerHTML=[[workers.length,'workers'],[ready,'ready'],[busy,'busy'],[missing,'missing']].map(([n,l])=>`<div class="metric"><b>${n}</b><span>${l}</span></div>`).join('');document.querySelector('#grid').innerHTML=[...workers, ...slots.filter(x=>x.role==='orchestrator')].map(card).join('');document.querySelector('#meta').innerHTML=`daemon ${esc(d.version)}<br>${esc(d.lastTickAt||'no tick yet')}`;}catch(e){showErr(e)}}
refresh();setInterval(refresh,3000);
</script></body></html>
